version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: envvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ../.. , dockerfile: infra/docker/Dockerfile.api }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/envvault
      PORT: 3001
    ports: ["3001:3001"]
    depends_on: [postgres]
  web:
    build: { context: ../.. , dockerfile: infra/docker/Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
