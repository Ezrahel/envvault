# EnvVault — stress-free local prod-like deploy on CockroachDB:
#   docker compose -f infra/docker/docker-compose.yml up --build
# Production: point DATABASE_URL at CockroachDB Cloud and set secrets via env.
services:
  cockroach:
    image: cockroachdb/cockroach:v24.3
    command: start-single-node --insecure --advertise-addr=cockroach
    restart: unless-stopped
    ports:
      - "${COCKROACH_PORT:-26257}:26257"
      - "${COCKROACH_UI_PORT:-8080}:8080"
    volumes: [cockroach-data:/cockroach/cockroach-data]
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One-shot: creates the envvault database (Cockroach has no POSTGRES_DB equivalent).
  cockroach-init:
    image: cockroachdb/cockroach:v24.3
    command: ["sql", "--insecure", "--host=cockroach:26257", "-e", "CREATE DATABASE IF NOT EXISTS envvault;"]
    depends_on:
      cockroach:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Local single-node (insecure). Prod (CockroachDB Cloud):
      #   DATABASE_URL=postgresql://<user>:<pass>@<host>:26257/envvault?sslmode=verify-full
      # (`cockroachdb://` scheme also accepted — normalized by the API.)
      DATABASE_URL: ${DATABASE_URL:-postgresql://root@cockroach:26257/envvault?sslmode=disable}
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # REQUIRED: compose fails fast if unset (openssl rand -base64 48).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before deploying (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    volumes:
      # Crash-safe snapshot for memory-mode fallback (unused when DB backend is active).
      - apidata:/app/data
    ports: ["${API_PORT:-3001}:3001"]
    depends_on:
      cockroach-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked at build time (NEXT_PUBLIC_*). Override for prod:
        #   NEXT_PUBLIC_API_URL=https://api.envvault.dev docker compose up --build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cockroach-data:
  apidata:
