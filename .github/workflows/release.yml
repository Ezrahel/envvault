name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm', registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm exec vitest run
      - name: Build CLI
        run: pnpm --filter envvault build
      - name: Sign artifacts (placeholder — use cosign in prod)
        run: |
          sha256sum packages/cli/dist/index.js > packages/cli/dist/index.js.sha256
          cat packages/cli/dist/index.js.sha256
      - name: Publish to npm (provenance)
        run: pnpm --filter envvault publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/cli/dist/index.js
            packages/cli/dist/index.js.sha256
          generate_release_notes: true
